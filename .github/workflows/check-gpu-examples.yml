name: Check NeuroForge GPU examples
"on":
  push:
    branches: [main]
    paths: [".github/workflows/check-gpu-examples.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed_examples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "gradio_client==2.7.2" "huggingface_hub==2.4.0"
      - name: Verify two fixed public engineering examples
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import re
          from gradio_client import Client
          client = Client(
              "Oageng/NeuroForge-AI", token=os.environ["HF_TOKEN"],
              verbose=False, analytics_enabled=False, download_files=False,
          )
          cases = [
              ("unit_conversion", "Convert 72 km/h to m/s and explain the result.", "unit_convert", 20.0),
              ("capacitor_energy", "Calculate the energy stored in a 0.22 F capacitor charged to 5.5 V. Use E = 0.5 * C * V^2 and report joules.", "calculator", 3.3275),
          ]
          for name, prompt, tool, expected in cases:
              try:
                  output = client.submit(prompt, 3, api_name="/run_task").result(timeout=150)
              except Exception as error:
                  print(json.dumps({"case": name, "request_error_type": type(error).__name__}))
                  raise SystemExit(1) from None
              status, trace = output[2], output[3]
              code = re.search(r"GPU_[A-Z_]+", status)
              if code:
                  print(json.dumps({"case": name, "gpu_status": code.group(0)}))
                  raise SystemExit(1)
              values = [
                  event.get("result", {}).get("result")
                  for event in trace
                  if event.get("event") == "tool" and event.get("tool") == tool
              ]
              verified = any(
                  isinstance(value, (int, float)) and math.isclose(value, expected, rel_tol=1e-9)
                  for value in values
              )
              print(json.dumps({"case": name, "verified": verified, "expected_result": expected,
                                "event_types": [event.get("event") for event in trace]}))
              if not verified:
                  print(json.dumps({"case": name, "own_test_errors": [event.get("detail", "")[:450] for event in trace if event.get("event") == "model_error"]}))
                  raise SystemExit(1)
          PY
